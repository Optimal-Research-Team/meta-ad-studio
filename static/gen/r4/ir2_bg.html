<!doctype html><html><head><meta charset="utf-8">
<style>

* { margin: 0; box-sizing: border-box; }

.f.post { height: 1350px; } .f.story { height: 1920px; }

.lab span { font-size: 28px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #4F5B4B; }
.track { position: relative; height: 34px; }
.track .line { position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: rgba(44,78,37,.35); }
.track .range { position: absolute; top: 0; bottom: 0; left: 18%; right: 18%; border-radius: 8px;

.track .dot { position: absolute; top: -9px; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; background: #2C4E25; box-shadow: 0 0 0 6px #F5EFE3; }
.ends { display: flex; justify-content: space-between; margin-top: 16px; font-size: 26px; color: #4F5B4B; font-weight: 500; }
