<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Optimal static ads renderer</title>
<style>
@font-face { font-family: "Castoro"; src: url("../brand/fonts/Castoro-Regular.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Castoro"; src: url("../brand/fonts/Castoro-Italic.ttf"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Public Sans"; src: url("../brand/fonts/PublicSans.ttf"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Public Sans"; src: url("../brand/fonts/PublicSans-Italic.ttf"); font-weight: 100 900; font-style: italic; }

/* Tokens mirror optimal-instagram/design-system/social.css so paid and organic read as one brand. */
:root {
  --cream: #FFFCF7; --white: #FFFFFF; --forest: #2C4E25; --forest-deep: #1A500F; --forest-night: #1C3118;
  --sage: #87A482; --sage-ground: #E8EDE2; --mint: #A4C29D; --bone: #E7E2D9;
  --ink-strong: #252525; --ink-soft: #474747; --ink-muted: #76736D; --hair: #DDDCDB;
  --ring: rgba(26, 80, 18, .55); --ring-on-dark: rgba(255, 252, 247, .62);
  --capsule: rgba(28, 49, 24, .9);
  --hatch: repeating-linear-gradient(135deg, rgba(44, 78, 37, .34) 0 1.5px, transparent 1.5px 6px), rgba(44, 78, 37, .08);
  --hatch-on-dark: repeating-linear-gradient(135deg, rgba(255, 252, 247, .30) 0 1.5px, transparent 1.5px 6px), rgba(255, 252, 247, .05);
  --photo-grade: saturate(.88) contrast(.96) brightness(1.02) sepia(.06);
  --serif: "Castoro", Georgia, serif;
  --sans: "Public Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #888; }
body { font-family: var(--sans); color: var(--ink-strong); -webkit-font-smoothing: antialiased; letter-spacing: -.012em; font-feature-settings: "kern", "liga"; }
#root { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; align-items: flex-start; }

/* ---------- frame ---------- */
.frame { position: relative; width: 1080px; overflow: hidden; background: var(--cream); color: var(--ink-strong); display: flex; flex-direction: column; flex: none; }
.frame.post { height: 1350px; padding: 84px 92px 88px; }
/* Reels safe zone: top 14% (269px), bottom 35% (672px). Nothing that must be read goes outside it. */
.frame.story { height: 1920px; padding: 270px 92px 672px; }
/* 4:5 frames whose engraving forms a base band: content stops above it */
.frame.post.band { padding-bottom: 250px; }
.post.band .tl li { padding: 15px 0; }
.frame.forest { background: var(--forest); color: var(--cream); }
.frame.night { background: var(--forest-night); color: var(--cream); }
.frame.sage { background: var(--sage-ground); }
.dark { --tone-muted: rgba(255, 252, 247, .66); }
.content { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.art { position: absolute; z-index: 1; pointer-events: none; }
.art img { display: block; width: 100%; height: auto; }

/* ---------- brand row ---------- */
.brandrow { display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none; }
.mark { display: inline-flex; align-items: center; gap: 13px; font-family: var(--serif); font-size: 33px; letter-spacing: -.02em; line-height: 1; }
.mark svg { width: 34px; height: 34px; color: var(--forest); }
.dark .mark svg, .capsule .mark svg { color: var(--cream); }
.tag { font-size: 21px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-muted); }
.dark .tag { color: var(--tone-muted); }

/* ---------- type ---------- */
.eyebrow { font-size: 27px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--forest); }
.dark .eyebrow, .capsule .eyebrow { color: var(--mint); }
.h { font-family: var(--serif); font-weight: 400; letter-spacing: -.03em; line-height: 1.0; text-wrap: balance; }
.post .h { font-size: 92px; }
.story .h { font-size: 88px; }
.h em { font-style: italic; color: var(--forest-deep); letter-spacing: -.02em; }
.dark .h em, .capsule .h em { color: var(--mint); }
.body { font-size: 35px; line-height: 1.42; color: var(--ink-soft); max-width: 860px; text-wrap: pretty; }
.body, .note, .tl p { text-wrap: pretty; }
.prow > div > span { text-wrap: balance; }
.dark .body, .capsule .body { color: rgba(255, 252, 247, .86); }
.rg { position: relative; display: inline-block; white-space: nowrap; }
.rg::after { content: ""; position: absolute; left: -.17em; right: -.2em; top: .04em; bottom: -.08em; border: 2.6px solid var(--ring); border-radius: 50%; transform: rotate(-3deg); }
.dark .rg::after, .capsule .rg::after { border-color: var(--ring-on-dark); }

/* ---------- CTA + footer ---------- */
.spacer { flex: 1 0 40px; }
/* footer: a hairline sign-off (the drawn CTA is off; Meta supplies the button) */
.foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex: none; padding-top: 24px; border-top: 1.5px solid var(--hair); }
.dark .foot { border-top-color: rgba(255, 252, 247, .2); }
.capsule .foot { border-top-color: rgba(255, 252, 247, .18); padding-top: 20px; margin-top: 10px; }
.url { font-size: 28px; font-weight: 600; letter-spacing: .01em; color: var(--forest); }
.dark .url, .capsule .url { color: var(--mint); }
.cta { display: inline-flex; align-items: center; gap: 18px; height: 96px; padding: 0 42px 0 46px; border-radius: 999px; background: var(--forest); color: var(--cream); font-size: 32px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; }
.cta svg { width: 30px; height: 30px; flex: none; }
.dark .cta, .capsule .cta { background: var(--cream); color: var(--forest); }
.addr { font-size: 28px; line-height: 1.3; color: var(--ink-muted); text-align: left; letter-spacing: .02em; }
.dark .addr, .capsule .addr { color: var(--tone-muted, rgba(255, 252, 247, .66)); }

/* ---------- M1 symptoms ---------- */
.tags { list-style: none; display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; }
.tags li { display: flex; align-items: center; gap: 20px; padding: 17px 0; border-top: 1.5px solid var(--hair); font-size: 35px; line-height: 1.2; color: var(--ink-strong); }
.tags li::before { content: ""; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--hatch); box-shadow: inset 0 0 0 1.8px rgba(44, 78, 37, .55); }
.tags li:nth-last-child(-n+2) { border-bottom: 1.5px solid var(--hair); }

/* ---------- M2 stat ---------- */
.statrow { display: flex; align-items: flex-end; gap: 26px; }
.stat { position: relative; display: inline-block; font-family: var(--serif); font-size: 380px; line-height: .8; letter-spacing: -.05em; color: var(--cream); }
.stat::before { content: ""; position: absolute; left: -6px; right: -10px; bottom: 8px; height: 42%; background: var(--hatch-on-dark); border-radius: 4px; }
.stat span { position: relative; }
.unit { font-family: var(--serif); font-style: italic; font-size: 76px; line-height: 1; letter-spacing: -.02em; color: var(--mint); padding-bottom: 18px; }
.stat-h { font-family: var(--serif); font-size: 66px; line-height: 1.06; letter-spacing: -.025em; text-wrap: balance; max-width: 860px; }
.stat-h em { font-style: italic; color: var(--mint); }

/* ---------- M3 price card / L1 ledger ---------- */
.card { background: var(--white); border-radius: 30px; box-shadow: 0 0 0 1.5px rgba(44, 78, 37, .14); padding: 8px 46px; }
.prow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 28px; padding: 32px 0; border-top: 1.5px solid var(--hair); }
.prow:first-child { border-top: 0; }
.prow b { display: block; font-family: var(--serif); font-weight: 400; font-size: 44px; letter-spacing: -.02em; line-height: 1.05; }
.prow > div > span { display: block; margin-top: 10px; font-size: 29px; line-height: 1.3; color: var(--ink-muted); max-width: 560px; }
.prow .p { font-family: var(--serif); font-size: 64px; letter-spacing: -.035em; color: var(--forest); white-space: nowrap; text-align: right; line-height: 1; }
.prow .p small { font-family: var(--sans); font-size: 26px; letter-spacing: .02em; color: var(--ink-muted); margin-left: 8px; }
.prow.free .p { font-style: italic; }
.note { font-size: 28px; line-height: 1.38; color: var(--ink-muted); max-width: 860px; }
.ledger { list-style: none; }
.ledger li { display: flex; align-items: center; gap: 22px; padding: 17px 0; border-top: 1.5px solid var(--hair); font-size: 36px; line-height: 1.2; }
.ledger li:first-child { border-top: 0; }
.ledger li svg { width: 34px; height: 34px; flex: none; color: var(--forest); }
.total { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; border-top: 2.5px solid var(--forest); padding: 26px 0 30px; }
.total .amt { font-family: var(--serif); font-size: 124px; line-height: .86; letter-spacing: -.045em; color: var(--forest); }
.total .amt small { font-family: var(--serif); font-size: 44px; letter-spacing: -.02em; color: var(--ink-muted); margin-left: 6px; }
.daily { margin-top: 10px; font-size: 29px; font-weight: 600; letter-spacing: .02em; color: var(--forest); }
.chip { display: inline-flex; align-items: center; height: 54px; padding: 0 26px; border-radius: 999px; background: var(--forest); color: var(--cream); font-size: 26px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; margin-bottom: 10px; }

/* ---------- M5 steps ---------- */
.tl { list-style: none; position: relative; }
.tl::before { content: ""; position: absolute; left: 47px; top: 70px; bottom: 70px; width: 2px; background: repeating-linear-gradient(180deg, rgba(44, 78, 37, .45) 0 8px, transparent 8px 16px); }
.tl li { position: relative; display: grid; grid-template-columns: 96px 1fr; gap: 34px; align-items: start; padding: 22px 0; }
.tl .n { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); box-shadow: inset 0 0 0 2px rgba(44, 78, 37, .5); font-family: var(--serif); font-style: italic; font-size: 52px; color: var(--forest); line-height: 1; padding-bottom: 6px; }
.tl li:first-child .n { background: var(--forest); color: var(--cream); box-shadow: none; }
.tl h4 { font-family: var(--serif); font-weight: 400; font-size: 50px; letter-spacing: -.025em; line-height: 1.05; padding-top: 14px; }
.tl p { margin-top: 8px; font-size: 33px; line-height: 1.4; color: var(--ink-muted); }

/* ---------- photo frames ---------- */
.frame.photo { padding: 0; color: var(--cream); background: #1d2a1a; }
.frame.photo .bg { position: absolute; inset: 0; z-index: 0; }
.frame.photo .bg img { width: 100%; height: 100%; object-fit: cover; filter: var(--photo-grade); }
.capsule { position: absolute; z-index: 2; left: 60px; right: 60px; background: var(--capsule); color: var(--cream); border-radius: 34px; padding: 44px 52px 50px; display: flex; flex-direction: column; gap: 22px; backdrop-filter: blur(10px); }
.capsule .h { font-size: 80px; }
.capsule .body { font-size: 32px; }
.capsule .cap-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.capsule .mark { font-size: 30px; }
.capsule .mark svg { width: 30px; height: 30px; }
.capsule .cta { height: 88px; font-size: 30px; padding: 0 38px 0 42px; }
.capsule .addr, .capsule .url { font-size: 26px; }

/* 9:16 sign-off: lives under the Reels caption, visible on Stories */
.signoff { position: absolute; z-index: 1; left: 0; right: 0; top: 1372px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.signoff svg { width: 132px; height: 132px; color: var(--forest); opacity: .85; }
.signoff span { font-family: var(--serif); font-size: 44px; letter-spacing: -.02em; color: var(--forest); }
.signoff i { width: 120px; height: 2px; background: currentColor; opacity: .25; }
.dark .signoff svg, .dark .signoff span { color: var(--cream); }
.story .tl li { padding: 14px 0; }
.story .total { padding: 20px 0 22px; }
.story .ledger li { padding: 12px 0; }
.post .ledger li { padding: 14px 0; }

/* ---------- L2 venn / L3 week / L4 inbody / L5 plate ---------- */
.venn { display: block; width: 100%; height: auto; }
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.day { position: relative; height: 290px; border-radius: 22px; background: var(--hatch); box-shadow: inset 0 0 0 1.5px rgba(44, 78, 37, .22); display: flex; flex-direction: column; justify-content: space-between; padding: 22px 0 22px 20px; }
.day .d { font-size: 26px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
.day .ev { font-family: var(--serif); font-size: 40px; line-height: 1.02; letter-spacing: -.02em; color: var(--forest); padding-right: 14px; }
.day.call { background: var(--white); box-shadow: inset 0 0 0 2px rgba(44, 78, 37, .45); }
.day.seen { background: var(--forest); box-shadow: none; }
.day.seen .d { color: rgba(255, 252, 247, .7); }
.day.seen .ev { color: var(--cream); font-style: italic; }
.day.quiet { opacity: .55; }
.track { position: relative; height: 150px; }
.track .line { position: absolute; left: 80px; right: 80px; top: 30px; height: 2px; background: rgba(44, 78, 37, .4); }
.track .node { position: absolute; top: 0; width: 160px; margin-left: -80px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.track .dot { width: 60px; height: 60px; border-radius: 50%; background: var(--hatch), var(--white); box-shadow: inset 0 0 0 2px rgba(44, 78, 37, .6); }
.track .node:nth-child(2) .dot { background: var(--forest); box-shadow: none; }
.track .lab { font-size: 26px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.track .lab b { display: block; text-align: center; font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -.02em; text-transform: none; color: var(--forest); margin-bottom: 2px; }
.pills { display: flex; gap: 12px; flex-wrap: wrap; }
.pill { height: 58px; display: inline-flex; align-items: center; padding: 0 26px; border-radius: 999px; box-shadow: inset 0 0 0 1.8px rgba(44, 78, 37, .4); font-size: 29px; font-weight: 500; color: var(--forest); background: rgba(255, 255, 255, .55); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hF" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="rgba(44,78,37,0.06)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(44,78,37,0.45)" stroke-width="2"/></pattern>
    <pattern id="hC" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="rgba(255,252,247,0.05)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(255,252,247,0.42)" stroke-width="2"/></pattern>
    <symbol id="sym" viewBox="0 0 864 864"><g fill="currentColor"><circle cx="177" cy="422" r="145"/><circle cx="318" cy="147" r="115"/><circle cx="309" cy="707" r="124"/><circle cx="599" cy="146" r="92"/><circle cx="598" cy="707" r="101"/><circle cx="757" cy="329" r="74"/><circle cx="757" cy="515" r="74"/></g></symbol>
    <symbol id="arr" viewBox="0 0 24 24"><path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chk" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.8"/><path d="M10.5 17.5l4.5 4.5 8.5-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div id="root"></div>
<script src="content.js"></script>
<script>
(function () {
  const md = s => String(s).replace(/\|/g, "<br>").replace(/\{(.+?)\}/g, '<span style="white-space:nowrap">$1</span>').replace(/\[\[(.+?)\]\]/g, '<span class="rg">$1</span>').replace(/\*(.+?)\*/g, "<em>$1</em>");
  const use = (id, cls) => `<svg class="${cls || ""}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const mark = () => `<span class="mark">${use("sym")}Optimal</span>`;
  const brand = (a, noTag) => `<div class="brandrow">${mark()}</div>`;   // Oct 13: tag dropped, unreadable at feed size
  const eb = s => s ? `<span class="eyebrow">${md(s)}</span>` : "";
  const SHOW_CTA = false;   // Oct 12: Meta overlays its own CTA button on the ad, so the drawn pill is off
  const cta = s => SHOW_CTA ? `<span class="cta">${s}${use("arr")}</span>` : "";
  const sign = () => `<span class="addr">630 Huronia Rd, Barrie</span><span class="url">beoptimal.ca</span>`;
  const foot = a => SHOW_CTA
    ? `<div class="spacer"></div><div class="foot">${cta(a.cta)}<span class="addr">630 Huronia Rd<br>Barrie, ON</span></div>`
    : `<div class="spacer"></div><div class="foot">${sign()}</div>`;
  const signoff = () => `<div class="signoff">${use("sym")}</div>`;
  const gap = n => `<div style="height:${n}px;flex:none"></div>`;
  const frame = (a, f, cls, inner) => `<div class="frame ${f} ${cls}" data-out="${a.svc}/${a.id}_${f === "post" ? "4x5" : "9x16"}">${inner}</div>`;

  const R = {
    symptoms(a, f) {
      const S = f === "story";
      const items = S ? a.items.slice(0, a.storyItems) : a.items;
      const art = S
        ? `<div class="art" style="width:760px;right:-150px;bottom:-120px;transform:rotate(-8deg)"><img src="assets/plate-hormones-f.png"></div>`
        : `<div class="art" style="width:470px;right:-80px;top:-6px;transform:rotate(-8deg)"><img src="assets/plate-hormones-f.png"></div>`;
      return frame(a, f, "", `${art}<div class="content">${brand(a, !S)}${gap(S ? 70 : 190)}
        <div style="display:flex;flex-direction:column;gap:26px">${eb(a.eb)}<h2 class="h" style="max-width:${S ? 900 : 900}px">${md(a.h)}</h2></div>
        ${gap(S ? 44 : 36)}<ul class="tags">${items.map(i => `<li>${i}</li>`).join("")}</ul>
        ${gap(S ? 36 : 28)}<p class="body" style="font-size:${S ? 34 : 33}px;max-width:${S ? 860 : 900}px">${md(a.body)}</p>
        ${foot(a)}</div>`);
    },
    stat(a, f) {
      const S = f === "story";
      const art = `<div class="art" style="left:0;right:0;bottom:${S ? 0 : -140}px;opacity:${S ? .9 : .55}"><img src="assets/engraving-shoreline-cream.png"></div>`;
      return frame(a, f, `forest dark ${S ? "" : "band"}`, `${art}<div class="content">${brand(a)}${gap(S ? 90 : 120)}
        ${eb(a.eb)}${gap(S ? 56 : 64)}
        <div class="statrow"><span class="stat"><span>${a.num}</span></span><span class="unit">${a.unit}</span></div>
        ${gap(S ? 44 : 50)}<h2 class="stat-h">${md(a.h)}</h2>
        ${gap(30)}<p class="body" style="max-width:820px">${md(a.body)}</p>
        ${foot(a)}</div>`);
    },
    price(a, f) {
      const S = f === "story";
      return frame(a, f, "sage", `<div class="content">${brand(a)}${gap(S ? 60 : 92)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h">${md(a.h)}</h2></div>
        ${gap(S ? 40 : 52)}<div class="card">${a.rows.map((r, i) => `<div class="prow ${r.p === "Free" ? "free" : ""}"><div><b>${r.l}</b>${S && i ? "" : `<span>${md(r.s)}</span>`}</div><div class="p">${r.p}${r.u ? `<small>${r.u}</small>` : ""}</div></div>`).join("")}</div>
        ${S ? "" : `${gap(30)}<p class="note">${a.note}</p>`}
        ${foot(a)}</div>${S ? signoff() : ""}`);
    },
    photo(a, f) {
      const S = f === "story";
      const at = (S && a.storyAt) || a.at;
      const where = at === "top" ? `top:${S ? 270 : 60}px` : `bottom:${S ? 672 : 60}px`;
      const zoom = S && a.storyZoom ? `;transform:scale(${a.storyZoom});transform-origin:${a.pos[f].split(" ")[0]} 0` : "";
      return frame(a, f, "photo", `<div class="bg"><img src="${a.img}" style="object-position:${a.pos[f]}${zoom}"></div>
        <div class="capsule" style="${where}">
          <div class="cap-top">${mark()}<span class="eyebrow" style="font-size:25px">${a.eb}</span></div>
          <h2 class="h">${md(a.h)}</h2><p class="body">${md(a.body)}</p>
          <div class="foot">${SHOW_CTA ? cta(a.cta) : sign()}</div>
        </div>`);
    },
    steps(a, f) {
      const S = f === "story";
      return frame(a, f, S ? "" : "band", `<div class="art" style="left:0;right:0;bottom:${S ? 0 : -140}px;opacity:${S ? .9 : .7}"><img src="assets/engraving-shoreline.png"></div>
        <div class="content">${brand(a)}${gap(S ? 40 : 56)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h">${md(a.h)}</h2></div>
        ${gap(S ? 22 : 26)}<ol class="tl">${a.steps.map(s => `<li><span class="n">${s.n}</span><div><h4>${s.t}</h4><p>${s.d}</p></div></li>`).join("")}</ol>
        ${foot(a)}</div>`);
    },
    ledger(a, f) {
      const S = f === "story";
      const items = S ? a.storyItems : a.items;
      return frame(a, f, "", `<div class="content">${brand(a)}${gap(S ? 22 : 64)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h">${md(a.h)}</h2></div>
        ${gap(S ? 14 : 36)}<ul class="ledger">${items.map(i => `<li>${use("chk")}${i}</li>`).join("")}</ul>
        <div class="total"><div><div class="amt">${a.price}<small>${a.per}</small></div>${a.daily ? `<div class="daily">${a.daily}</div>` : ""}</div><span class="chip">${a.chip}</span></div>
        ${foot(a)}</div>${S ? signoff() : ""}`);
    },
    venn(a, f) {
      const S = f === "story";
      const svg = `<svg class="venn" viewBox="0 0 896 400" aria-hidden="true">
        <defs><clipPath id="cl-${f}"><circle cx="318" cy="200" r="186"/></clipPath></defs>
        <circle cx="318" cy="200" r="186" fill="none" stroke="rgba(255,252,247,.55)" stroke-width="2.5"/>
        <circle cx="578" cy="200" r="186" fill="rgba(255,252,247,.07)" stroke="#FFFCF7" stroke-width="2.5"/>
        <circle cx="578" cy="200" r="186" fill="url(#hC)" clip-path="url(#cl-${f})"/>
        <text x="236" y="186" text-anchor="middle" font-family="Castoro" font-size="33" fill="#FFFCF7" letter-spacing="-0.6">Your family</text>
        <text x="236" y="226" text-anchor="middle" font-family="Castoro" font-size="33" fill="#FFFCF7" letter-spacing="-0.6">doctor</text>
        <text x="236" y="266" text-anchor="middle" font-family="Public Sans" font-weight="600" font-size="21" letter-spacing="2.2" fill="rgba(255,252,247,.6)">OHIP</text>
        <text x="448" y="214" text-anchor="middle" font-family="Castoro" font-style="italic" font-size="50" fill="#A4C29D">You</text>
        <text x="652" y="186" text-anchor="middle" font-family="Castoro" font-size="33" fill="#FFFCF7" letter-spacing="-0.6">Your Optimal</text>
        <text x="652" y="226" text-anchor="middle" font-family="Castoro" font-size="33" fill="#FFFCF7" letter-spacing="-0.6">NP team</text>
        <text x="652" y="266" text-anchor="middle" font-family="Public Sans" font-weight="600" font-size="21" letter-spacing="2.2" fill="rgba(255,252,247,.6)">MEMBERSHIP</text></svg>`;
      return frame(a, f, "forest dark", `<div class="content">${brand(a)}${gap(S ? 60 : 96)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h" style="font-size:${S ? 74 : 78}px">${md(a.h)}</h2></div>
        ${gap(S ? 40 : 56)}${svg}${gap(S ? 36 : 50)}<p class="body">${md(a.body)}</p>
        ${foot(a)}</div>${S ? signoff() : ""}`);
    },
    week(a, f) {
      const S = f === "story";
      const days = [["Mon", "You call", "call"], ["Tue", "Seen", "seen"], ["Wed", "", "quiet"], ["Thu", "", "quiet"], ["Fri", "", "quiet"]];
      return frame(a, f, "", `<div class="content">${brand(a)}${gap(S ? 60 : 120)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h">${md(a.h)}</h2></div>
        ${gap(S ? 50 : 70)}<div class="week">${days.map(d => `<div class="day ${d[2]}"><span class="d">${d[0]}</span><span class="ev">${d[1]}</span></div>`).join("")}</div>
        ${gap(S ? 40 : 56)}<p class="body">${md(a.body)}</p>
        ${foot(a)}</div>${S ? signoff() : ""}`);
    },
    inbody(a, f) {
      const S = f === "story";
      const nodes = [["0", "Baseline"], ["3", "Month"], ["6", "Month"], ["9", "Month"]];
      const art = S
        ? `<div class="art" style="width:760px;right:-150px;bottom:-190px"><img src="assets/02-inbody-580.png"></div>`
        : `<div class="art" style="width:520px;left:290px;top:70px"><img src="assets/02-inbody-580.png"></div>`;
      return frame(a, f, "sage", `${art}<div class="content">${brand(a, !S)}${gap(S ? 60 : 478)}
        <div style="display:flex;flex-direction:column;gap:24px">${eb(a.eb)}<h2 class="h" style="max-width:${S ? 900 : 800}px">${md(a.h)}</h2></div>
        ${gap(S ? 56 : 52)}<div class="track"><div class="line"></div>${nodes.map((n, i) => `<div class="node" style="left:${80 + i * (736 / 3)}px"><span class="dot"></span><span class="lab"><b>${n[0] === "0" ? "Day 1" : n[0]}</b>${n[0] === "0" ? "Baseline" : "Months"}</span></div>`).join("")}</div>
        ${gap(S ? 40 : 34)}<div class="pills"><span class="pill">Muscle mass</span><span class="pill">Body fat</span><span class="pill">Visceral fat</span></div>
        ${S ? `${gap(34)}<p class="body" style="font-size:33px">${md(a.body)}</p>` : ""}
        ${foot(a)}</div>`);
    },
    plate(a, f) {
      const S = f === "story";
      const art = S
        ? `<div class="art" style="width:860px;left:110px;bottom:-250px"><img src="assets/plate-heart-cream.png"></div>`
        : `<div class="art" style="width:480px;right:-30px;top:-24px"><img src="assets/plate-heart-cream.png"></div>`;
      return frame(a, f, "night dark", `${art}<div class="content">${brand(a, !S)}${gap(S ? 80 : 460)}
        <div style="display:flex;flex-direction:column;gap:26px">${eb(a.eb)}<h2 class="h" style="font-size:${S ? 100 : 96}px">${md(a.h)}</h2></div>
        ${gap(S ? 40 : 36)}<p class="body" style="max-width:800px">${md(a.body)}</p>
        ${foot(a)}</div>`);
    }
  };

  const only = new URLSearchParams(location.search).get("only");
  const root = document.getElementById("root");
  root.innerHTML = window.ADS.filter(a => !only || only.split(",").includes(a.id))
    .map(a => R[a.t](a, "post") + R[a.t](a, "story")).join("");
})();
</script>
</body>
</html>
